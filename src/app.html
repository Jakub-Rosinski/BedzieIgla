<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- ── Favicon ──────────────────────────────────────────────────────── -->
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />

        <!-- ── Primary meta ────────────────────────────────────────────────── -->
        <meta
            name="description"
            content="Studio tatuażu Będzie Igła! w Gliwicach. Gosia Wiśniewska — artystka tatuażu z wykształceniem artystycznym ASP. Indywidualne projekty, różne style. Umów sesję."
        />
        <meta name="robots" content="index, follow" />
        <meta name="author" content="Gosia Wiśniewska" />
        <meta name="keywords" content="tatuaż Gliwice, studio tatuażu Gliwice, tatuatorka Gliwice, Będzie Igła, Gosia Wiśniewska tattoo, tatuaż artystyczny, tatuaż Śląsk" />

        <!-- ── Open Graph ───────────────────────────────────────────────────── -->
        <meta property="og:type"        content="website" />
        <meta property="og:site_name"   content="Będzie Igła!" />
        <meta property="og:url"         content="https://bedzieigla.pl/" />
        <meta property="og:locale"      content="pl_PL" />
        <meta property="og:title"       content="Będzie Igła! — Gosia Wiśniewska Tattoo" />
        <meta
            property="og:description"
            content="Studio tatuażu Będzie Igła! w Gliwicach. Indywidualne projekty, różne style. Umów sesję z Gosią Wiśniewską."
        />
        <meta property="og:image"       content="https://bedzieigla.pl/logo.png" />
        <meta property="og:image:alt"   content="Logo studio tatuażu Będzie Igła!" />

        <!-- ── Twitter / X Card ────────────────────────────────────────────── -->
        <meta name="twitter:card"        content="summary_large_image" />
        <meta name="twitter:title"       content="Będzie Igła! — Gosia Wiśniewska Tattoo" />
        <meta
            name="twitter:description"
            content="Studio tatuażu Będzie Igła! w Gliwicach. Indywidualne projekty, różne style."
        />
        <meta name="twitter:image"       content="https://bedzieigla.pl/logo.png" />

        <!-- ── Google Fonts ─────────────────────────────────────────────────── -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&display=swap"
            rel="stylesheet"
        />

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
