name: Deploy → OVH Perso

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false   # deploy nigdy nie przerywamy w połowie

jobs:
  # ─── Sprawdzanie typów ──────────────────────────────────────────────────────
  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # ─── Testy jednostkowe ──────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test --reporter=verbose

  # ─── Testy E2E ──────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [check, unit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_S3_LIST_URL: ""
          VITE_S3_PUBLIC_URL: ""

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Build produkcyjny ──────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Tylko zmienne VITE_* — wbudowywane w build klienta w tym kroku, tak jak dotychczas.
          # Sekrety SMTP_*/CONTACT_TO_EMAIL NIGDY tutaj nie trafiają — są czytane w runtime
          # na VPS z lokalnego .env (patrz deploy/.env.example), nie z GitHub Actions.
          VITE_S3_LIST_URL:   ${{ secrets.VITE_S3_LIST_URL }}
          VITE_S3_PUBLIC_URL: ${{ secrets.VITE_S3_PUBLIC_URL }}
          VITE_S3_PREFIX:     ${{ secrets.VITE_S3_PREFIX }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  # ─── Deploy na OVH VPS przez SSH (Node.js / PM2) ───────────────────────────
  # UWAGA: sekrety SMTP_*/CONTACT_TO_EMAIL nigdy nie pojawiają się w tym pliku —
  # żyją wyłącznie w niewersjonowanym .env na VPS (patrz deploy/.env.example),
  # czytane w runtime przez $env/dynamic/private. Ten job odpowiada tylko za
  # zsynchronizowanie builda i przeładowanie procesu PM2.
  deploy:
    name: Deploy (SSH → OVH VPS)
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Checkout (for package.json / pnpm-lock.yaml)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists on VPS
        # rsync only creates the last path component, so without this the very
        # first deploy to a fresh VPS fails on the missing parent directory.
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'mkdir -p ~/bedzieigla/build'

      - name: Sync build + package files to VPS
        run: |
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/bedzieigla"
          rsync -az --delete build/ "$DEST/build/"
          rsync -az package.json pnpm-lock.yaml "$DEST/"

      - name: Install prod deps + reload app
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd ~/bedzieigla &&
            corepack enable &&
            corepack prepare pnpm@9.15.0 --activate &&
            pnpm install --prod --frozen-lockfile &&
            pm2 reload ecosystem.config.js --env production
          '
